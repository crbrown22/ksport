<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed, Agility & Conditioning Athlete Login | KROME Sports Performance</title>
    <meta name="description" content="Log in to your KROME Speed, Agility & Conditioning 12-Week Athlete Portal using your athlete email and Access Key Code.">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <script src="https://kit.fontawesome.com/2c43223b58.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --krome-gold: #ffd447;
            --krome-gold-hover: #f59e0b;
            --krome-dark: #090a0d;
            --krome-card-bg: #12151b;
            --krome-card-border: rgba(255, 212, 71, 0.22);
            --krome-text-main: #f8fafc;
            --krome-text-muted: #94a3b8;
        }

        body {
            background-color: var(--krome-dark);
            color: var(--krome-text-main);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .portal-nav {
            background: rgba(15, 18, 24, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 212, 71, 0.2);
            padding: 0.85rem 0;
        }

        .brand-logo {
            font-weight: 900;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--krome-gold);
            text-decoration: none;
            text-transform: uppercase;
        }

        .login-card {
            background: linear-gradient(180deg, #161a22 0%, #11141a 100%);
            border: 1px solid var(--krome-card-border);
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.65), 0 0 30px rgba(255, 212, 71, 0.08);
            overflow: hidden;
            max-width: 480px;
            width: 100%;
        }

        .form-control-custom {
            background-color: #0b0d12 !important;
            border: 1px solid rgba(255, 255, 255, 0.16) !important;
            color: #ffffff !important;
            border-radius: 0.65rem;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
        }

        .form-control-custom:focus {
            border-color: var(--krome-gold) !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 212, 71, 0.2) !important;
        }

        .btn-gold {
            background-color: var(--krome-gold);
            color: #000;
            font-weight: 800;
            border-radius: 0.65rem;
            padding: 0.85rem 1.5rem;
            border: none;
            text-transform: uppercase;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }

        .btn-gold:hover {
            background-color: var(--krome-gold-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 212, 71, 0.35);
        }
    </style>
</head>

<body>

    <header class="portal-nav">
        <div class="container d-flex align-items-center justify-content-between">
            <a href="index.html" class="brand-logo">
                <i class="fas fa-bolt text-warning me-2"></i> KROME SPORTS PERFORMANCE
            </a>
            <a href="shop.html" class="btn btn-sm btn-outline-secondary text-light rounded-pill px-3">
                <i class="fas fa-store me-1"></i> Shop
            </a>
        </div>
    </header>

    <main class="container my-auto py-5 d-flex align-items-center justify-content-center">
        <div class="login-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle p-3 mb-2" style="width: 60px; height: 60px;">
                    <i class="fas fa-bolt fa-2x"></i>
                </div>
                <h3 class="fw-bold text-white mb-1">Speed & Conditioning</h3>
                <p class="text-secondary small mb-0">Sign in to your 12-Week Athlete Portal</p>
            </div>

            <div id="auth-alert" class="alert d-none mb-4 py-2 px-3 small rounded-3" role="alert"></div>

            <form id="login-form" onsubmit="handleConditioningLogin(event)">
                <div class="mb-3">
                    <label for="login-email" class="form-label text-light small fw-bold">Athlete Email Address:</label>
                    <input type="email" id="login-email" class="form-control form-control-custom" placeholder="e.g. swolecode@gmail.com" required>
                </div>

                <div class="mb-4">
                    <label for="login-access-key" class="form-label text-light small fw-bold">Program Access Key Code:</label>
                    <input type="password" id="login-access-key" class="form-control form-control-custom" placeholder="Enter key code" required>
                </div>

                <button type="submit" id="btn-submit" class="btn btn-gold w-100 py-3 fw-bold d-flex align-items-center justify-content-center gap-2">
                    <span>Unlock & Open Portal</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
                <p class="text-secondary small mb-1">Not enrolled in this program yet?</p>
                <a href="program_detail.html?id=sports-conditioning" class="text-warning fw-bold text-decoration-none small">Buy Speed & Conditioning Program ($99)</a>
            </div>
        </div>
    </main>

    <footer class="bg-black py-4 border-top border-secondary border-opacity-25 text-center small text-secondary mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 KROME Sports Performance. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/leads.js"></script>
    <script>
        async function handleConditioningLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const accessKey = document.getElementById('login-access-key').value.trim();
            const btn = document.getElementById('btn-submit');
            const alertEl = document.getElementById('auth-alert');

            alertEl.classList.add('d-none');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Verifying Key...`;

            try {
                localStorage.setItem('krome_athlete_email', email);
                localStorage.setItem('krome_athlete_name', email.split('@')[0] || 'Athlete');
                localStorage.setItem('krome_access_key', accessKey);
                localStorage.setItem('krome_conditioning_unlocked', 'true');
                localStorage.setItem('krome_auth_token', btoa(email + ':' + Date.now()));

                if (typeof window.sendLeadToGoogle === 'function') {
                    window.sendLeadToGoogle({
                        email: email,
                        fullName: email.split('@')[0],
                        program: 'Speed, Agility & Conditioning Manual',
                        accessKey: accessKey,
                        source: 'Conditioning Login Page',
                        action: 'conditioning_portal_login'
                    }).catch(() => {});
                }

                alertEl.className = "alert alert-success py-2 px-3 small rounded-3";
                alertEl.textContent = "Access Verified! Opening Portal...";
                alertEl.classList.remove('d-none');

                setTimeout(() => {
                    window.location.href = 'conditioning_manual.html';
                }, 800);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = `<span>Unlock & Open Portal</span> <i class="fas fa-arrow-right"></i>`;
                alertEl.className = "alert alert-danger py-2 px-3 small rounded-3";
                alertEl.textContent = "Error setting up athlete session.";
                alertEl.classList.remove('d-none');
            }
        }
    </script>
    <script src="js/profile_nav.js"></script>
</body>
</html>
